<!DOCTYPE html>
<html>
<head>
    <title>AI Waste Guide</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f8f4;
            color: #173b2b;
        }

        .page {
            max-width: 430px;
            margin: auto;
            padding: 25px 20px;
        }

        .back {
            border: none;
            background: none;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #718078;
            margin-bottom: 25px;
        }

        .upload {
            background: white;
            border: 2px dashed #8ab99e;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
        }

        .upload-icon {
            font-size: 50px;
        }

        input[type="file"] {
            width: 100%;
            margin-top: 15px;
        }

        #preview {
            display: none;
            width: 100%;
            margin-top: 20px;
            border-radius: 15px;
        }

        .analyze {
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            border: none;
            border-radius: 14px;
            background: #1f7a4d;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .result {
            display: none;
            background: white;
            margin-top: 25px;
            padding: 20px;
            border-radius: 20px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #718078;
        }
    </style>
</head>

<body>

<div class="page">

    <button class="back" onclick="history.back()">← Back</button>

    <h1>🤖 AI Waste Guide</h1>

    <p class="subtitle">
        Upload a waste photo and let AI identify it.
    </p>

    <div class="upload">

        <div class="upload-icon">📷</div>

        <p><b>Upload a waste photo</b></p>

        <input type="file" id="photoInput" accept="image/*">

        <img id="preview">

    </div>

    <button class="analyze" onclick="analyzeWaste()">
        🔍 Analyze Waste
    </button>

    <p id="loading" class="loading">
        🤖 AI is analyzing your image...
    </p>

    <div id="result" class="result"></div>

</div>

<script>

const photoInput = document.getElementById("photoInput");
const preview = document.getElementById("preview");

photoInput.addEventListener("change", function () {

    const file = photoInput.files[0];

    if (file) {

        preview.src = URL.createObjectURL(file);

        preview.style.display = "block";
    }

});


async function analyzeWaste() {

    const file = photoInput.files[0];

    const result = document.getElementById("result");

    const loading = document.getElementById("loading");

    if (!file) {

        alert("Please upload a waste photo first.");

        return;
    }

    loading.style.display = "block";

    result.style.display = "none";

    const formData = new FormData();

    formData.append("image", file);

    try {

        const response = await fetch("/analyze", {

            method: "POST",

            body: formData

        });

        const data = await response.json();

        loading.style.display = "none";

        if (response.ok && data.result) {

            result.innerText =
                "🤖 AI Waste Analysis\n\n" + data.result;

        } else {

            result.innerText =
                "❌ AI ERROR\n\n" +
                (data.error || "Unknown error");

        }

        result.style.display = "block";

    } catch (error) {

        loading.style.display = "none";

        result.innerText =
            "❌ CONNECTION ERROR\n\n" +
            error.message;

        result.style.display = "block";

        console.error(error);
    }

}

</script>

</body>
</html>
